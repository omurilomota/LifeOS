spring:
  application:
    name: lifeos-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lifeos}
    username: ${DB_USERNAME:lifeos}
    password: ${DB_PASSWORD:lifeos}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: ${SESSION_COOKIE_SAMESITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.0}

lifeos:
  observability:
    error-reporter:
      enabled: ${ERROR_REPORTER_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    root: ${FILE_STORAGE_ROOT:./docker-data/storage}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:disabled}
