spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

server:
  servlet:
    session:
      cookie:
        secure: true
        same-site: ${SESSION_COOKIE_SAMESITE:none}

logging:
  level:
    root: INFO
    com.lifeos: INFO
